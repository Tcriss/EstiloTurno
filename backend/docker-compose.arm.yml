version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: estiloturno_db_arm
    platform: linux/arm64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: estiloturno_secure_pass_2026
      POSTGRES_DB: estiloturno
    ports:
      - "5432:5432"
    volumes:
      - pgdata_arm:/var/lib/postgresql/data

volumes:
  pgdata_arm:
